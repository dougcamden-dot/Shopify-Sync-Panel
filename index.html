<!DOCTYPE html>
<html lang="en">
<head>
<meta name="shopify-api-key" content="646438f2d8c49abfe99a2adeab3d073b">
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopify ↔ QuickBooks sync</title>
<style>
:root{
  --paper:#F6F7F5; --panel:#FFFFFF; --ink:#1E2B33; --steel:#687985; --rule:#DCE1E3; --rule-soft:#ECEFF0;
  --brass:#B5832A; --brass-deep:#8C6420; --brass-pale:#F4EAD6;
  --good:#2E7A57; --good-pale:#E3F1EA; --bad:#B23F2E; --bad-pale:#F7E4E0; --warn:#9A6B12; --warn-pale:#FBF0D9;
  --head:"Bahnschrift","DIN Alternate","DIN 2014","Roboto Condensed","DejaVu Sans Condensed","Arial Narrow",sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
a{color:var(--brass-deep)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num,td.r,th.r{font-variant-numeric:tabular-nums}

/* frame */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{border-right:1px solid var(--rule);padding:22px 0;background:var(--panel);position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 22px 20px;font-family:var(--head);font-size:19px;line-height:1.2;letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);font-size:12.5px;color:var(--steel);margin-top:4px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 22px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
nav a:hover{background:var(--rule-soft)}
nav a.on{border-left-color:var(--brass);background:var(--brass-pale);font-weight:600}
nav .count{margin-left:6px;font-family:var(--head);font-size:13px;min-width:22px;text-align:center;border-radius:10px;padding:0 6px;background:var(--bad);color:#fff}
nav .count.soft{background:var(--rule);color:var(--ink)}
nav .foot{padding:18px 22px;font-size:12.5px;color:var(--steel);border-top:1px solid var(--rule);margin-top:18px}
nav .foot a{display:inline;padding:0;border:0;color:var(--brass-deep);text-decoration:underline}
nav .foot a:hover{background:none}
main{padding:26px 34px 60px;max-width:1280px;width:100%;min-width:0}
h1{font-family:var(--head);font-weight:600;font-size:28px;line-height:1.15;margin:0 0 4px}
h2{font-family:var(--head);font-weight:600;font-size:19px;margin:30px 0 10px}
.sub{color:var(--steel);margin:0 0 20px;max-width:75ch}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:18px}

/* the key tag: sync health */
.tag{position:relative;display:flex;align-items:center;gap:16px;padding:14px 22px 14px 52px;border-radius:12px 34px 34px 12px;
     background:var(--brass);color:#fff;min-width:330px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tag::before{content:"";position:absolute;left:18px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;
     background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.tag.bad{background:var(--bad)} .tag.idle{background:var(--steel)} .tag.run{background:var(--good)}
.tag .big{font-family:var(--head);font-size:22px;line-height:1.1}
.tag .small{font-size:13px;opacity:.92}
.tag .bar{height:5px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:6px;overflow:hidden}
.tag .bar i{display:block;height:100%;background:#fff}

.banner{border:1px solid var(--warn);background:var(--warn-pale);padding:10px 14px;border-radius:6px;margin:0 0 18px;max-width:900px}
.banner.bad{border-color:var(--bad);background:var(--bad-pale)}

/* period picker */
.period{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.period button{border:1px solid var(--rule);background:var(--panel);padding:5px 11px;border-radius:5px;cursor:pointer}
.period button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.period input{border:1px solid var(--rule);background:var(--panel);padding:4px 6px;border-radius:5px}

/* ledger row of figures */
.ledger{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--rule);border-radius:6px}
.fig{flex:1 1 150px;padding:14px 18px;border-right:1px solid var(--rule)}
.fig:last-child{border-right:0}
.fig .v{font-family:var(--head);font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.fig .l{color:var(--steel);font-size:13px}
.fig.lead .v{font-size:32px;color:var(--brass-deep)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px 18px}
.panel h2{margin-top:0}

/* chart */
.chart{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px 18px 8px;margin-top:18px}
.chart svg{display:block;width:100%;height:220px}
.legend{display:flex;gap:18px;font-size:13px;color:var(--steel)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* bar lists */
.blist{list-style:none;margin:0;padding:0}
.blist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:6px 0;border-bottom:1px solid var(--rule-soft)}
.blist li:last-child{border-bottom:0}
.blist .meter{grid-column:1/-1;height:6px;background:var(--rule-soft);border-radius:3px;overflow:hidden}
.blist .meter i{display:block;height:100%;background:var(--ink)}
.blist .amt{font-variant-numeric:tabular-nums}
.blist .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--steel)}

/* attention list */
.att{list-style:none;margin:0;padding:0}
.att li{padding:8px 0 8px 14px;border-left:3px solid var(--bad);margin:0 0 8px;background:var(--bad-pale);border-radius:0 4px 4px 0;padding-right:10px}
.att li.w{border-left-color:var(--warn);background:var(--warn-pale)}
.att li.ok{border-left-color:var(--good);background:var(--good-pale)}

/* tables */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.tools input[type=search]{border:1px solid var(--rule);background:var(--panel);padding:6px 10px;border-radius:5px;min-width:260px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--rule);background:var(--panel);border-radius:14px;padding:3px 11px;cursor:pointer;font-size:13.5px}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tools .spacer{flex:1}
.btn{border:1px solid var(--ink);background:var(--panel);padding:5px 12px;border-radius:5px;cursor:pointer}
.btn:hover{background:var(--ink);color:#fff}
.tablewrap{background:var(--panel);border:1px solid var(--rule);border-radius:6px;overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:#EEF1F2;text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
th.nosort{cursor:default}
th .arrow{color:var(--brass-deep);margin-left:4px}
td{padding:7px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
td.nw{white-space:nowrap}
td.wide{min-width:230px}
td .pill{white-space:normal}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFAF8}
tr.open td{background:var(--brass-pale)}
tr.detail td{background:#FCFBF7;padding:10px 18px 16px}
.count-line{color:var(--steel);font-size:13px;margin-top:8px}
.pill{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:10px;background:var(--rule-soft);white-space:nowrap}
.pill.good{background:var(--good-pale);color:var(--good)} .pill.bad{background:var(--bad-pale);color:var(--bad)}
.pill.warn{background:var(--warn-pale);color:var(--warn)} .pill.brass{background:var(--brass-pale);color:var(--brass-deep)}
.lines{border-collapse:collapse;width:auto;min-width:60%;font-size:13.5px;margin-top:6px}
.lines td,.lines th{border-bottom:1px solid var(--rule-soft);padding:4px 10px;background:none;position:static}
.empty{padding:28px;color:var(--steel);text-align:center}
.subtabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin:18px 0 12px}
.subtabs button{border:0;background:none;padding:8px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.subtabs button.on{border-bottom-color:var(--brass);font-weight:600}
pre.summary{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px 16px;white-space:pre-wrap;font:13.5px/1.5 var(--body);margin:0}
.back{display:inline-block;margin-bottom:10px}

/* inside Shopify admin: Shopify already provides the left sidebar, so pages become tabs */
body.embedded .app{grid-template-columns:1fr}
body.embedded nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:2px;padding:6px 26px 0;border-right:0;border-bottom:1px solid var(--rule)}
body.embedded nav .brand{display:none}
body.embedded nav a{border-left:0;border-bottom:3px solid transparent;padding:8px 12px;margin-bottom:-1px}
body.embedded nav a.on{border-bottom-color:var(--brass);background:none}
body.embedded nav .foot{display:block;border:0;margin:0 0 0 auto;padding:8px 0;align-self:center}
body.embedded main{padding:22px 26px 50px}
@media (max-width:900px){
  .app{grid-template-columns:1fr} nav{position:static;height:auto;display:flex;flex-wrap:wrap;padding:10px}
  nav .brand,nav .foot{display:none} nav a{border-left:0;border-bottom:3px solid transparent;padding:6px 10px}
  nav a.on{border-bottom-color:var(--brass)} main{padding:18px} .grid2{grid-template-columns:1fr} .tag{min-width:0;width:100%}
  .fig{flex-basis:45%;border-bottom:1px solid var(--rule)}
}
@media (prefers-reduced-motion:no-preference){ .tag .bar i{transition:width .6s ease} }

tr.detail td td,tr.detail td th{padding:4px 10px}
/* sync now */
.syncbox{padding:14px 22px 0}
.syncbox .btn{width:100%;text-align:center}
.syncbox .state{font-size:12.5px;color:var(--steel);margin-top:6px}
.syncbox .state.warn{color:var(--warn)}
.syncbox details{font-size:12.5px;margin-top:4px} .syncbox summary{cursor:pointer;color:var(--brass-deep)}
.syncbox ul{margin:4px 0 0;padding-left:16px;max-height:180px;overflow:auto}
body.embedded .syncbox{padding:4px 0 4px 12px;margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
body.embedded .syncbox .btn{width:auto} body.embedded .syncbox .state,body.embedded .syncbox details{margin:0}
body.embedded .syncbox ul{position:absolute;background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:6px 6px 6px 22px;z-index:6;box-shadow:0 6px 18px rgba(30,43,51,.12)}
body.embedded nav .foot{margin-left:12px}
/* purchasing */
nav a[hidden],[hidden]{display:none!important}
body.embedded .app{grid-template-rows:auto 1fr}
body.embedded nav{align-items:center;align-content:flex-start;row-gap:0}
body.embedded nav a{padding:7px 10px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--brass);border-color:var(--brass-deep);color:#fff}
.btn.primary:hover{background:var(--brass-deep)}
.btn.danger{border-color:var(--bad);color:var(--bad)} .btn.danger:hover{background:var(--bad);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.link{border:0;background:none;color:var(--brass-deep);text-decoration:underline;cursor:pointer;padding:0}
.banner.good{border-color:var(--good);background:var(--good-pale)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 18px;max-width:900px;margin:0 0 18px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--steel)}
.form .wide{grid-column:1/-1}
.form input,.form select,.form textarea,.tools select,label>input{border:1px solid var(--rule);background:var(--panel);padding:6px 9px;border-radius:5px;color:var(--ink);font:inherit}
.form label.check,label.check{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
table.edit input{border:1px solid var(--rule);border-radius:4px;padding:3px 6px;background:#fff;width:100%;min-width:90px}
table.edit input.n{width:84px;min-width:0;text-align:right}
table.edit th{cursor:default} table.edit tfoot td{background:#FAFAF8;border-top:1px solid var(--rule)}
tr.muted-row td{color:var(--steel)}
tr.hit td{background:var(--good-pale)}
.picker{position:relative;max-width:520px;margin:0 0 10px}
.picker input{width:100%;border:1px solid var(--rule);background:var(--panel);padding:7px 10px;border-radius:5px}
.picks{position:absolute;z-index:5;left:0;right:0;top:100%;margin:2px 0 0;padding:4px 0;list-style:none;background:var(--panel);border:1px solid var(--rule);border-radius:5px;box-shadow:0 6px 18px rgba(30,43,51,.12);max-height:320px;overflow:auto}
.picks button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;cursor:pointer}
.picks button:hover,.picks button:focus{background:var(--brass-pale)}
#printarea{display:none}
@media print{
  body>*:not(#printarea){display:none!important} #printarea{display:block} body{background:#fff}
  .po-print{font:12pt/1.4 var(--body)} .po-print table{width:100%;border-collapse:collapse;margin:12px 0} .po-print td,.po-print th{border-bottom:1px solid #ccc;padding:5px;position:static;background:none;text-align:left}
  .po-print .r{text-align:right} .po-print .meta td{vertical-align:top;border:0;width:33%}
  .labels.roll{display:block} .labels.roll .label{width:2.25in;height:1.25in;page-break-after:always;padding:.06in .1in}
  .labels.sheet{display:grid;grid-template-columns:repeat(3,2.625in);column-gap:.125in;grid-auto-rows:1in;padding:.5in .19in 0}
  .labels.sheet .label{height:1in;padding:.05in .12in;overflow:hidden} .labels.sheet .label:nth-child(30n){page-break-after:always}
  .label{display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;font-family:Arial,sans-serif;color:#000;overflow:hidden}
  .label .lt{font-size:8pt;line-height:1.1;max-height:2.2em;overflow:hidden} .label .lp{font-size:12pt;font-weight:bold}
  .label .bc{width:100%;height:.38in;display:block} .label .lc{font-size:7pt;text-align:center;letter-spacing:.05em}
  @page{margin:0}
}
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Pages">
    <div class="brand">Doug's Lock &amp; Key<small>Shopify ↔ QuickBooks sync</small></div>
    <a href="#overview" data-page="overview">Overview</a>
    <a href="#sales" data-page="sales">Sales posted</a>
    <a href="#invoices" data-page="invoices">Open invoices <span class="count soft" id="n-inv" hidden></span></a>
    <a href="#inventory" data-page="inventory">Stock</a>
    <a href="#products" data-page="products">Products</a>
    <a href="#customers" data-page="customers">Customers</a>
    <a href="#reconcile" data-page="reconcile">Reconcile <span class="count" id="n-rec" hidden></span></a>
    <a href="#history" data-page="history">Sync history</a>
    <a href="#pos" data-page="pos" class="purch" hidden>Purchase orders</a>
    <a href="#reorder" data-page="reorder" class="purch" hidden>Reorder</a>
    <a href="#counts" data-page="counts" class="purch" hidden>Stock counts</a>
    <a href="#labels" data-page="labels" class="purch" hidden>Labels</a>
    <a href="#value" data-page="value" class="purch" hidden>Stock value</a>
    <a href="#problems" data-page="problems">Problems <span class="count" id="n-prob" hidden></span></a>
    <div class="syncbox" id="syncbox" aria-live="polite"></div>
    <div class="foot" id="foot">Loading…</div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>

<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
const money = v => (v===null||v===undefined||v==="") ? "" : usd.format(+v);
const n0 = v => (v===null||v===undefined||v==="") ? "" : (+v).toLocaleString("en-US");
const when = ts => ts ? new Date(ts*1000).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
const ago = ts => { if(!ts) return "never"; const m=Math.round((Date.now()/1000-ts)/60);
  if(m<1) return "just now"; if(m<60) return m+" min ago"; const h=Math.round(m/60); if(h<48) return h+" h ago"; return Math.round(h/24)+" days ago"; };
const ymd = d => d.toISOString().slice(0,10);
const shortDate = s => { if(!s) return ""; const d=new Date(s+"T12:00:00");
  return d.toLocaleDateString("en-US", d.getFullYear()===new Date().getFullYear() ? {month:"short",day:"numeric"} : {month:"short",day:"numeric",year:"numeric"}); };
const niceDate = s => s ? new Date(s+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "";
const ADMIN = !!document.querySelector('meta[name="shopify-api-key"]');
async function api(path){
  if(ADMIN) return adminApi(path);
  const r = await fetch(path,{cache:"no-store"}); if(!r.ok) throw new Error(path+" "+r.status); return r.json();
}

/* ---------- Shopify admin mode: data published by the sync program into Shopify ---------- */
const AD = { status:null, loadedAt:0, parts:{} };
async function gql(query){
  const r = await fetch("shopify:admin/api/2026-10/graphql.json",{method:"POST",body:JSON.stringify({query})});
  const j = await r.json(); if(j.errors) throw new Error(j.errors.map(e=>e.message).join("; ")); return j.data;
}
async function loadKeys(keys){
  const need = keys.filter(k=>!(k in AD.parts));
  for(let i=0;i<need.length;i+=8){
    const batch=need.slice(i,i+8);
    const q = "{ currentAppInstallation { " + batch.map((k,j)=>`m${j}: metafield(namespace: "qbsync", key: "${k}") { value }`).join(" ") + " } }";
    const d = (await gql(q)).currentAppInstallation;
    batch.forEach((k,j)=>{ const v=d["m"+j]; AD.parts[k] = v ? JSON.parse(v.value) : {cols:[],rows:[]}; });
  }
}
async function adminStatus(){
  if(AD.status && Date.now()-AD.loadedAt < 60000) return AD.status;
  const d = (await gql('{ currentAppInstallation { metafield(namespace: "qbsync", key: "status") { value } } }')).currentAppInstallation;
  if(!d || !d.metafield) return null;
  const st = JSON.parse(d.metafield.value);
  if(!AD.status || AD.status.published !== st.published) AD.parts = {};
  AD.status = st; AD.loadedAt = Date.now(); return st;
}
async function adminTable(name){
  const st = AD.status; const keys = (st.index||{})[name] || [];
  await loadKeys(keys);
  const out=[]; keys.forEach(k=>{ const t=AD.parts[k]; t.rows.forEach(r=>{ const o={}; t.cols.forEach((c,i)=>o[c]=r[i]); out.push(o); }); });
  return out;
}
async function adminSales(){
  const rows = await adminTable("sales");
  rows.forEach(r=>{ if(r.lines && Array.isArray(r.lines[0]||null)) r.lines = r.lines.map(l=>({desc:l[0],qty:l[1],rate:l[2],amount:l[3],item:l[4],account:l[5]})); });
  return rows;
}
function inRange(q){ const p=new URLSearchParams(q); let [f,t]=periodRange(); return [p.get("from")||f, p.get("to")||t]; }
async function adminApi(path){
  const [route, q=""] = path.split("?");
  const st = await adminStatus();
  if(!st) return {empty:true, settings:{}, kpis:{}};
  const P = st.problems;
  if(route==="/api/problems") return P;
  if(route==="/api/runs") return {rows: st.runs};
  if(route==="/api/run"){ const id=+new URLSearchParams(q).get("id"); const r=st.runs.find(x=>x.id===id); if(!r) return {missing:true};
    const acts = (await adminTable("activity")).filter(a=>a.run_id===id).reverse();
    return {...r, report:{}, activity:acts, admin_note: !st.activity_runs.includes(id)}; }
  if(route==="/api/reconcile"){ const keys=(st.index||{}).recon||[]; if(!keys.length) return {empty:true};
    await loadKeys(keys); return {...AD.parts[keys[0]], orders: await adminTable("reconorders")}; }
  if(route==="/api/inventory") return {...st.meta.inventory, rows: await adminTable("inventory")};
  if(route==="/api/products") return {linked: st.meta.products.linked, rows: await adminTable("products")};
  if(route==="/api/customers") return {linked: st.meta.customers.linked, rows: await adminTable("customers"), top: await adminTable("topcustomers")};
  const sales = await adminSales();
  if(route==="/api/invoices"){
    const today=new Date(); const rows = sales.filter(r=>r.kind==="invoice").map(r=>{ const bal=Math.round(((r.total||0)-(r.paid||0))*100)/100;
      return {...r, lines:undefined, balance:bal, open:bal>0.005, age_days: Math.floor((today-new Date(r.date+"T12:00:00"))/864e5)}; })
      .sort((a,b)=>a.date.localeCompare(b.date));
    return {rows, payments: await adminTable("payments")};
  }
  const [from,to] = inRange(q);
  const inR = sales.filter(r=>r.date>=from && r.date<=to);
  if(route==="/api/sales") return {from,to, rows:[...inR].sort((a,b)=> b.date.localeCompare(a.date) || String(b.order_name).localeCompare(String(a.order_name)))};
  // overview
  const k={}; const add=(n,v)=>k[n]=(k[n]||0)+(v||0);
  const daily={}, byM={}, byA={}, byS={}, items={};
  inR.forEach(r=>{ const tot=r.total||0; add("sales",tot); add("orders",1); add(r.kind==="receipt"?"receipts":"invoices",1);
    ["tax","discount","tip","shipping","refunded","subtotal","giftcard"].forEach(f=>add(f,r[f]));
    const d=daily[r.date]||(daily[r.date]={receipts:0,invoices:0,count:0}); d[r.kind==="receipt"?"receipts":"invoices"]+=tot; d.count++;
    const mk=r.method||(r.kind==="invoice"?"Invoice (unpaid)":"No payment"); const m=byM[mk]||(byM[mk]={total:0,count:0}); m.total+=tot; m.count++;
    const sk=r.source||"unknown"; const s=byS[sk]||(byS[sk]={total:0,count:0}); s.total+=tot; s.count++;
    (r.lines||[]).forEach(l=>{ if(l.qty!==""&&l.qty!==null&&l.qty!==undefined){ byA[l.account||"?"]=(byA[l.account||"?"]||0)+(l.amount||0);
      const it=items[l.desc||"?"]||(items[l.desc||"?"]={qty:0,amount:0}); it.qty+=+l.qty; it.amount+=l.amount||0; } }); });
  k.net_sales=(k.sales||0)-(k.refunded||0); k.avg_order=k.orders?k.sales/k.orders:0;
  const open = sales.filter(r=>r.kind==="invoice" && (r.total||0)-(r.paid||0)>0.005);
  k.open_invoices=open.length; k.open_invoices_total=open.reduce((a,r)=>a+(r.total-(r.paid||0)),0);
  const days=[]; for(let d=new Date(from+"T12:00:00"); ymd(d)<=to && days.length<400; d.setDate(d.getDate()+1)){ const iso=ymd(d); days.push({date:iso, ...(daily[iso]||{receipts:0,invoices:0,count:0})}); }
  const list=(o,f)=>Object.entries(o).map(([name,v])=>typeof v==="number"?{name,total:v}:{name,...v}).sort((a,b)=>f(b)-f(a));
  return { settings: st.settings, running:null, last_run: st.runs[0]||null, last_live_ok: st.last_live_ok, from, to, kpis:k, daily:days,
    by_method:list(byM,x=>x.total), by_account:list(byA,x=>x.total), by_source:list(byS,x=>x.total), top_items:list(items,x=>x.amount).slice(0,10),
    problem_count: P.failed.length + P.last_errors.filter(e=>!e.startsWith("Order ")).length, waiting_count: P.waiting.length, published: st.published,
    recon_problems: (st.recon||{}).problems||0 };
}

let SETTINGS = {};
const state = { period: localStorage.getItem("period") || "30d", from: null, to: null };

/* ---------- period ---------- */
function periodRange(){
  const t = new Date(); const d = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const p = state.period;
  if(p==="custom" && state.from && state.to) return [state.from, state.to];
  if(p==="today") return [ymd(d), ymd(d)];
  if(p==="7d"){ const s=new Date(d); s.setDate(s.getDate()-6); return [ymd(s), ymd(d)]; }
  if(p==="month") return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), ymd(d)];
  if(p==="lastmonth") return [ymd(new Date(d.getFullYear(), d.getMonth()-1, 1)), ymd(new Date(d.getFullYear(), d.getMonth(), 0))];
  if(p==="year") return [ymd(new Date(d.getFullYear(),0,1)), ymd(d)];
  const s=new Date(d); s.setDate(s.getDate()-29); return [ymd(s), ymd(d)];
}
function periodPicker(onChange){
  const opts=[["today","Today"],["7d","7 days"],["30d","30 days"],["month","This month"],["lastmonth","Last month"],["year","This year"],["custom","Custom"]];
  const [f,t] = periodRange();
  const wrap = document.createElement("div"); wrap.className="period"; wrap.setAttribute("role","group"); wrap.setAttribute("aria-label","Date range");
  wrap.innerHTML = opts.map(([k,l])=>`<button type="button" data-p="${k}" class="${state.period===k?"on":""}" aria-pressed="${state.period===k}">${l}</button>`).join("")
    + `<span ${state.period==="custom"?"":"hidden"} id="customdates"><input type="date" id="pf" value="${f}" aria-label="From"> to <input type="date" id="pt" value="${t}" aria-label="To"></span>`;
  wrap.addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return;
    state.period=b.dataset.p; localStorage.setItem("period", state.period);
    if(state.period==="custom"){ const [a,z]=periodRange(); state.from=a; state.to=z; }
    onChange(); });
  wrap.addEventListener("change", ()=>{ state.from=$("#pf",wrap).value; state.to=$("#pt",wrap).value; onChange(); });
  return wrap;
}

/* ---------- generic table ---------- */
function makeTable(host, {columns, rows, search=true, chips=null, detail=null, csvName="report", emptyText="Nothing here yet.", sort=null}){
  const st = { q:"", chip: chips ? chips[0][0] : null, sortKey: sort ? sort[0] : null, dir: sort ? sort[1] : 1, open: new Set() };
  host.innerHTML = `<div class="tools">${search?'<input type="search" placeholder="Search" aria-label="Search this table">':""}
     <div class="chips">${(chips||[]).map(([k,l])=>`<button type="button" data-k="${esc(k)}">${esc(l)}</button>`).join("")}</div>
     <span class="spacer"></span><button type="button" class="btn" data-csv>Download CSV</button></div>
     <div class="tablewrap"><table><thead><tr>${columns.map(c=>`<th class="${c.r?"r":""} ${c.nosort?"nosort":""}" data-k="${c.k}" scope="col">${esc(c.l)}<span class="arrow"></span></th>`).join("")}</tr></thead><tbody></tbody></table></div>
     <div class="count-line"></div>`;
  const tbody=$(".tablewrap > table > tbody",host), head=$(".tablewrap > table > thead",host), countLine=$(".count-line",host);
  const filtered = () => {
    let r = rows;
    if(chips && st.chip){ const f = chips.find(c=>c[0]===st.chip)[2]; if(f) r = r.filter(f); }
    if(st.q){ const q=st.q.toLowerCase(); r = r.filter(x => columns.some(c => String(c.v ? c.v(x) : x[c.k] ?? "").toLowerCase().includes(q))); }
    if(st.sortKey){ const c = columns.find(c=>c.k===st.sortKey); const val = x => c.sv ? c.sv(x) : (c.v ? c.v(x) : x[c.k]);
      r = [...r].sort((a,b)=>{ const A=val(a), B=val(b); const na=typeof A==="number"||(A!==""&&A!==null&&!isNaN(A)&&typeof A!=="boolean"&&c.r);
        if(na) return ((+A||0)-(+B||0))*st.dir; return String(A??"").localeCompare(String(B??""))*st.dir; }); }
    return r;
  };
  const draw = () => {
    const r = filtered();
    $$chips();
    head.querySelectorAll("th").forEach(th=>{ const a=$(".arrow",th); a.textContent = th.dataset.k===st.sortKey ? (st.dir>0?"▲":"▼") : "";
      th.setAttribute("aria-sort", th.dataset.k===st.sortKey ? (st.dir>0?"ascending":"descending") : "none"); });
    if(!r.length){ tbody.innerHTML = `<tr><td colspan="${columns.length}" class="empty">${esc(rows.length? "No rows match." : emptyText)}</td></tr>`; countLine.textContent=""; return; }
    const shown = r.slice(0, 2000);
    tbody.innerHTML = shown.map((x,i)=>{ const id = x.__id ?? i; const open = st.open.has(id);
      const main = `<tr class="${detail?"click":""} ${open?"open":""}" data-id="${esc(id)}" ${detail?'tabindex="0" aria-expanded="'+open+'"':""}>${columns.map(c=>`<td class="${c.r?"r":""} ${c.nw?"nw":""} ${c.w?"wide":""}">${c.f ? c.f(x) : esc(c.v ? c.v(x) : x[c.k])}</td>`).join("")}</tr>`;
      return main + (open && detail ? `<tr class="detail"><td colspan="${columns.length}">${detail(x)}</td></tr>` : ""); }).join("");
    countLine.textContent = `${r.length.toLocaleString()} of ${rows.length.toLocaleString()} rows` + (r.length>shown.length?` (showing first ${shown.length})`:"");
    host._filtered = r;
  };
  function $$chips(){ host.querySelectorAll(".chips button").forEach(b=>{ const on=b.dataset.k===st.chip; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); }); }
  rows.forEach((x,i)=>{ if(x.__id===undefined) x.__id=i; });
  host.addEventListener("input", e=>{ if(e.target.type==="search"){ st.q=e.target.value; draw(); }});
  host.addEventListener("click", e=>{
    const th=e.target.closest("th"); if(th && head.contains(th) && !th.classList.contains("nosort")){ const k=th.dataset.k; st.dir = st.sortKey===k ? -st.dir : 1; st.sortKey=k; draw(); return; }
    const chip=e.target.closest(".chips button"); if(chip){ st.chip=chip.dataset.k; draw(); return; }
    if(e.target.closest("[data-csv]")){ downloadCsv(csvName, columns, host._filtered||rows); return; }
    if(e.target.closest("a")) return;
    const tr=e.target.closest("tr.click"); if(tr){ toggle(tr); }
  });
  host.addEventListener("keydown", e=>{ const tr=e.target.closest("tr.click"); if(tr && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); toggle(tr); }});
  function toggle(tr){ const id=rows.find(x=>String(x.__id)===tr.dataset.id)?.__id; if(id===undefined) return; st.open.has(id)?st.open.delete(id):st.open.add(id); draw(); }
  draw();
}
function downloadCsv(name, columns, rows){
  const cell = v => { const s=String(v??""); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const out = [columns.map(c=>cell(c.l)).join(",")].concat(rows.map(x=>columns.map(c=>cell(c.csv ? c.csv(x) : (c.v ? c.v(x) : x[c.k]))).join(",")));
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([out.join("\r\n")],{type:"text/csv"}));
  a.download=`${name}_${ymd(new Date())}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- small pieces ---------- */
function shopifyOrderLink(row){
  const id = String(row.order_id||"").split("/").pop();
  if(ADMIN && id) return `<a href="shopify://admin/orders/${esc(id)}" target="_top">${esc(row.order_name)}</a>`;
  if(!SETTINGS.admin_url || !id) return esc(row.order_name);
  return `<a href="${esc(SETTINGS.admin_url)}/orders/${esc(id)}" target="_blank" rel="noopener">${esc(row.order_name)}</a>`;
}
function statusPill(s){
  const map={ok:["good","Finished"],errors:["warn","Finished with errors"],failed:["bad","Stopped"],running:["brass","Running"],interrupted:["bad","Interrupted"]};
  const [c,l]=map[s]||["","?"]; return `<span class="pill ${c}">${l}</span>`;
}
function barList(items, valueFmt, labelKey="name", valueKey="total", extra=null){
  if(!items.length) return `<p class="muted">Nothing in this period.</p>`;
  const max = Math.max(...items.map(x=>Math.abs(x[valueKey]))) || 1;
  return `<ul class="blist">${items.map(x=>`<li><span class="who">${esc(x[labelKey])}${extra?` <span class="muted">${esc(extra(x))}</span>`:""}</span><span class="amt">${valueFmt(x[valueKey])}</span>
    <span class="meter"><i style="width:${Math.max(1,Math.abs(x[valueKey])/max*100)}%"></i></span></li>`).join("")}</ul>`;
}
function dailyChart(days){
  const W=1000,H=220,pl=58,pr=10,pt=10,pb=26;
  const max = Math.max(1, ...days.map(d=>d.receipts+d.invoices));
  const nice = (()=>{ const p=Math.pow(10,Math.floor(Math.log10(max))); const m=max/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; })();
  const bw=(W-pl-pr)/days.length; const y=v=>pt+(H-pt-pb)*(1-v/nice);
  let g=""; for(let i=0;i<=4;i++){ const v=nice*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#ECEFF0"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#687985">${usd.format(v).replace(".00","")}</text>`; }
  const step=Math.ceil(days.length/12);
  const bars=days.map((d,i)=>{ const x=pl+i*bw+bw*.15, w=Math.max(1,bw*.7);
    const r=d.receipts, v=d.invoices; const tip=`${niceDate(d.date)}: ${usd.format(r+v)} (${d.count} orders)`;
    return `<g><title>${esc(tip)}</title>${r>0?`<rect x="${x}" y="${y(r)}" width="${w}" height="${y(0)-y(r)}" fill="#1E2B33"/>`:""}
      ${v>0?`<rect x="${x}" y="${y(r+v)}" width="${w}" height="${y(r)-y(r+v)}" fill="#B5832A"/>`:""}
      ${i%step===0?`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#687985">${esc(new Date(d.date+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}))}</text>`:""}</g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Sales per day">${g}${bars}</svg>`;
}

   Suppliers, purchase orders, receiving, reorder suggestions, stock counts,
   barcode labels and stock value. Records live in Shopify as this app's own
   metaobjects; the sync program posts receipts and counts to QuickBooks.
   ====================================================================== */
const PURCH = { cat:null, catAt:0, suppliers:null, pos:null, counts:null };
const T_SUP = "$app:qb_supplier", T_PO = "$app:qb_purchase_order", T_CNT = "$app:qb_stock_count";
const purchOn = () => ADMIN && SETTINGS.purchasing && SETTINGS.purchasing.enabled;
const legacy = gid => String(gid||"").split("/").pop();
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const int = v => { const n = parseInt(v,10); return isFinite(n) ? n : 0; };
const nowIso = () => new Date().toISOString();
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));

async function gqlv(query, variables){
  const r = await fetch("shopify:admin/api/2026-10/graphql.json",{method:"POST",body:JSON.stringify({query, variables})});
  const j = await r.json();
  if(j.errors) throw new Error(j.errors.map(e=>e.message).join("; "));
  return j.data;
}
function userErrs(payload){ const e=(payload&&payload.userErrors)||[]; if(e.length) throw new Error(e.map(x=>x.message).join("; ")); return payload; }

/* ---------- catalog (all products with stock, cost, barcode, reorder settings) ---------- */
const CATALOG_Q = `query PanelCatalog($cursor: String, $loc: ID!) {
  productVariants(first: 100, after: $cursor) {
    pageInfo { hasNextPage endCursor }
    nodes { id title sku price
      product { id title productType status }
      barcodes(first: 1) { nodes { value } }
      inventoryItem { id tracked unitCost { amount }
        inventoryLevel(locationId: $loc) { quantities(names: ["on_hand", "available"]) { name quantity } } }
      reorder: metafield(namespace: "$app", key: "reorder") { value } } } }`;
async function loadCatalog(force){
  if(PURCH.cat && !force && Date.now()-PURCH.catAt < 300000) return PURCH.cat;
  const loc = SETTINGS.location_id; if(!loc) throw new Error("Run one sync first so the panel knows your store location.");
  const list=[]; let cursor=null;
  do { const d=(await gqlv(CATALOG_Q,{cursor,loc})).productVariants;
    d.nodes.forEach(v=>{ const inv=v.inventoryItem||{}; const q={}; ((inv.inventoryLevel||{}).quantities||[]).forEach(x=>q[x.name]=x.quantity);
      let rule={}; try{ rule = v.reorder && v.reorder.value ? JSON.parse(v.reorder.value) : {}; }catch(e){}
      const vt = v.title && v.title!=="Default Title" ? ` - ${v.title}` : "";
      list.push({ id:v.id, productId:v.product.id, title:v.product.title+vt, type:v.product.productType||"", status:v.product.status,
        sku:v.sku||"", barcode:((v.barcodes||{}).nodes||[])[0]?.value||"", price:num(v.price), invId:inv.id, tracked:!!inv.tracked,
        cost:num((inv.unitCost||{}).amount), onHand: q.on_hand ?? 0, available: q.available ?? 0, rule }); });
    cursor = d.pageInfo.hasNextPage ? d.pageInfo.endCursor : null;
  } while(cursor);
  PURCH.cat = { list, byId:Object.fromEntries(list.map(v=>[v.id,v])), byCode:{} };
  list.forEach(v=>{ [v.barcode, v.sku, (v.rule||{}).sku].filter(Boolean).forEach(c=>PURCH.cat.byCode[String(c).toLowerCase()]=v); });
  PURCH.catAt = Date.now(); return PURCH.cat;
}
function findByCode(code){
  const c=String(code||"").trim().toLowerCase(); if(!c) return null;
  const cat=PURCH.cat; if(cat.byCode[c]) return cat.byCode[c];
  const gen = c.match(/^29(\d+)$/); if(gen){ const v=cat.list.find(x=>legacy(x.id)===gen[1]); if(v) return v; }
  return cat.list.find(v=>v.title.toLowerCase()===c) || null;
}

/* ---------- metaobjects ---------- */
const META_LIST = `query PanelMeta($type: String!, $cursor: String) { metaobjects(type: $type, first: 50, after: $cursor) {
  pageInfo { hasNextPage endCursor } nodes { id handle updatedAt fields { key value } } } }`;
const META_CREATE = `mutation PanelMetaCreate($metaobject: MetaobjectCreateInput!) { metaobjectCreate(metaobject: $metaobject) {
  metaobject { id handle updatedAt fields { key value } } userErrors { field message } } }`;
const META_UPDATE = `mutation PanelMetaUpdate($id: ID!, $metaobject: MetaobjectUpdateInput!) { metaobjectUpdate(id: $id, metaobject: $metaobject) {
  metaobject { id handle updatedAt fields { key value } } userErrors { field message } } }`;
function parseMeta(n){ const f={}; (n.fields||[]).forEach(x=>f[x.key]=x.value);
  const j=k=>{ try{ return f[k]?JSON.parse(f[k]):{}; }catch(e){ return {}; } };
  return { id:n.id, handle:n.handle, updatedAt:n.updatedAt, name:f.name||"", status:f.status||"", supplier:f.supplier||"", data:j("data"), qb:j("qb") }; }
async function listMeta(type){
  const out=[]; let cursor=null;
  do { const d=(await gqlv(META_LIST,{type,cursor})).metaobjects; d.nodes.forEach(n=>out.push(parseMeta(n)));
    cursor=d.pageInfo.hasNextPage?d.pageInfo.endCursor:null; } while(cursor);
  return out;
}
function metaFields(rec, keys){ return keys.map(k=>({key:k, value: (k==="data"||k==="qb") ? JSON.stringify(rec[k]||{}) : String(rec[k]??"")})); }
async function saveMeta(type, rec, keys){
  if(rec.id){ const r=userErrs((await gqlv(META_UPDATE,{id:rec.id, metaobject:{fields:metaFields(rec,keys)}})).metaobjectUpdate); return parseMeta(r.metaobject); }
  const r=userErrs((await gqlv(META_CREATE,{metaobject:{type, handle:rec.handle, fields:metaFields(rec,keys)}})).metaobjectCreate);
  return parseMeta(r.metaobject);
}
async function loadSuppliers(force){ if(!PURCH.suppliers||force) PURCH.suppliers=(await listMeta(T_SUP)).sort((a,b)=>a.name.localeCompare(b.name)); return PURCH.suppliers; }
async function loadPOs(force){ if(!PURCH.pos||force) PURCH.pos=(await listMeta(T_PO)).sort((a,b)=>b.name.localeCompare(a.name,undefined,{numeric:true})); return PURCH.pos; }
async function loadCounts(force){ if(!PURCH.counts||force) PURCH.counts=(await listMeta(T_CNT)).sort((a,b)=>b.name.localeCompare(a.name,undefined,{numeric:true})); return PURCH.counts; }
function nextNumber(list, prefix){ let n=1000; list.forEach(r=>{ const m=String(r.name).match(/(\d+)$/); if(m) n=Math.max(n,int(m[1])); }); return `${prefix}-${n+1}`; }
function onOrder(){ const m={}; (PURCH.pos||[]).forEach(p=>{ if(p.status==="ordered"||p.status==="partial") (p.data.lines||[]).forEach(l=>{ m[l.variant_id]=(m[l.variant_id]||0)+Math.max(0,int(l.qty)-int(l.received)); }); }); return m; }
async function loadVelocity(){ try{ await adminStatus(); const keys=(AD.status.index||{}).velocity||[]; await loadKeys(keys); return keys.length?AD.parts[keys[0]]:{}; }catch(e){ return {}; } }

/* ---------- small UI helpers ---------- */
function setBusy(btn, on, label){ if(!btn) return; if(on){ btn.dataset.l=btn.textContent; btn.textContent=label||"Working…"; btn.disabled=true; } else { btn.textContent=btn.dataset.l||btn.textContent; btn.disabled=false; } }
function flash(host, msg, kind){ const el=document.createElement("div"); el.className="banner"+(kind==="bad"?" bad":kind==="good"?" good":""); el.setAttribute("role", kind==="bad"?"alert":"status"); el.textContent=msg; host.prepend(el); setTimeout(()=>el.remove(), kind==="bad"?15000:6000); }
const poStatus = s => ({draft:["","Draft"],ordered:["brass","Ordered"],partial:["warn","Partly received"],received:["good","Received"],cancelled:["bad","Cancelled"]}[s]||["",s]);
const pill = ([c,l]) => `<span class="pill ${c}">${esc(l)}</span>`;
function qbState(p){ const r=(p.data.receipts||[]); if(!r.length) return ""; const done=Object.keys((p.qb||{}).receipts||{}).length;
  const errs=Object.keys((p.qb||{}).errors||{}).length; if(errs) return '<span class="pill bad">QuickBooks problem</span>';
  return done>=r.length ? '<span class="pill good">In QuickBooks</span>' : '<span class="pill warn">Waiting for sync</span>'; }
function productPicker(onPick, placeholder){
  const wrap=document.createElement("div"); wrap.className="picker";
  wrap.innerHTML=`<input type="search" placeholder="${esc(placeholder||"Add a product: type a name, or scan a barcode")}" aria-label="Find a product" autocomplete="off"><ul class="picks" hidden></ul>`;
  const inp=$("input",wrap), ul=$("ul",wrap);
  const show=()=>{ const q=inp.value.trim().toLowerCase(); if(q.length<2){ ul.hidden=true; return; }
    const hits=PURCH.cat.list.filter(v=>v.title.toLowerCase().includes(q)||v.barcode.toLowerCase()===q||v.sku.toLowerCase()===q).slice(0,12);
    ul.innerHTML=hits.map(v=>`<li><button type="button" data-id="${esc(v.id)}">${esc(v.title)} <span class="muted">${v.tracked?`${v.onHand} on hand`:"not stock-tracked"}</span></button></li>`).join("")||'<li class="muted" style="padding:6px 10px">No match</li>'; ul.hidden=false; };
  inp.addEventListener("input", show);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); const v=findByCode(inp.value); if(v){ onPick(v); inp.value=""; ul.hidden=true; } else show(); } });
  ul.addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; onPick(PURCH.cat.byId[b.dataset.id]); inp.value=""; ul.hidden=true; inp.focus(); });
  return wrap;
}

const SET_COST = `mutation PanelCost($id: ID!, $input: InventoryItemInput!) { inventoryItemUpdate(id: $id, input: $input) { inventoryItem { id } userErrors { field message } } }`;
pages.receive = async (main, arg) => {

  let po = pos.find(p=>legacy(p.id)===arg);
  if(!po){ main.innerHTML=`<a class="back" href="#pos">All purchase orders</a><p>That purchase order wasn't found.</p>`; return; }
  const pendingKey="receipt_"+po.id; let pending=JSON.parse(localStorage.getItem(pendingKey)||"null");
  const lines=(po.data.lines||[]).map(l=>({...l, now: Math.max(0,int(l.qty)-int(l.received)), newCost:num(l.cost)}));

    main.innerHTML=`<a class="back" href="#po/${esc(legacy(po.id))}">Back to ${esc(po.name)}</a>
      <h1>Receive ${esc(po.name)} from ${esc(po.supplier)}</h1>

      <div class="tools"><input id="scan" type="search" placeholder="Scan a barcode to count it in" aria-label="Scan to receive"><span class="spacer"></span>

      <div class="tablewrap"><table class="edit"><thead><tr><th>Product</th><th class="r">Ordered</th><th class="r">Already in</th><th class="r">Receiving now</th><th class="r">Unit cost</th><th class="r">On hand</th></tr></thead><tbody>
      ${lines.map((l,i)=>{ const v=PURCH.cat.byId[l.variant_id]; return `<tr data-i="${i}" class="${l.now>0?"":"muted-row"}"><td>${esc(l.title)}${v&&!v.tracked?' <span class="pill warn">not stock-tracked</span>':""}</td>
        <td class="r">${int(l.qty)}</td><td class="r">${int(l.received)}</td>
        <td class="r"><input class="n" type="number" min="0" step="1" data-k="now" value="${l.now}" aria-label="Receiving now"></td>
        <td class="r"><input class="n" type="number" min="0" step="0.01" data-k="newCost" value="${num(l.newCost).toFixed(2)}" aria-label="Unit cost on invoice"></td>
        <td class="r">${v?esc(v.onHand):""}</td></tr>`; }).join("")}</tbody></table></div>
      <label style="display:block;margin-top:12px;max-width:600px">Note (packing slip number, damages…)<input id="note" style="width:100%"></label>
      <div class="actions" style="margin-top:14px"><button class="btn primary" data-a="receive">Receive</button></div>`;
  };
  const collect=()=>main.querySelectorAll("tr[data-i]").forEach(tr=>{ const l=lines[int(tr.dataset.i)]; l.now=Math.max(0,int($('[data-k="now"]',tr).value)); l.newCost=num($('[data-k="newCost"]',tr).value); });
  const finishSave = async (rc) => {
    po = (await loadPOs(true)).find(p=>p.id===po.id);
    if(!(po.data.receipts||[]).some(r=>r.id===rc.id)){
      rc.lines.forEach(x=>{ const l=po.data.lines.find(y=>y.variant_id===x.variant_id); if(l){ l.received=int(l.received)+int(x.qty); } });
      po.data.receipts=[...(po.data.receipts||[]), rc];
      const allIn=po.data.lines.every(l=>int(l.received)>=int(l.qty)); po.status= allIn?"received":"partial";
      await saveMeta(T_PO, po, ["name","status","supplier","data"]); }
    localStorage.removeItem(pendingKey); pending=null; PURCH.pos=null; PURCH.cat=null;
  };
  main.addEventListener("keydown", e=>{ if(e.target.id==="scan" && e.key==="Enter"){ e.preventDefault(); collect(); const v=findByCode(e.target.value); e.target.value="";
    const i=v?lines.findIndex(l=>l.variant_id===v.id):-1; if(i<0){ flash(main,v?`${v.title} isn't on this purchase order.`:"No product has that barcode.","bad"); return; }
    if(!e.target.dataset.counted){ lines.forEach(l=>l.now=0); e.target.dataset.counted="1"; }
    lines[i].now+=1; render(); const tr=main.querySelector(`tr[data-i="${i}"]`); tr.classList.add("hit"); $("#scan",main).focus(); } });
  main.addEventListener("click", async e=>{ const b=e.target.closest("[data-a]"); if(!b) return; collect();
    if(b.dataset.a==="all"){ lines.forEach(l=>l.now=Math.max(0,int(l.qty)-int(l.received))); render(); return; }
    if(b.dataset.a==="none"){ lines.forEach(l=>l.now=0); render(); return; }
    if(b.dataset.a==="finish"){ setBusy(b,true,"Saving…"); try{ await finishSave(pending); flash(main,"Saved.","good"); location.hash="#po/"+legacy(po.id); }catch(err){ flash(main,"Still couldn't save: "+err.message,"bad"); setBusy(b,false); } return; }
    if(b.dataset.a!=="receive") return;
    const got=lines.filter(l=>l.now>0); if(!got.length){ flash(main,"Nothing to receive: enter the quantities that arrived.","bad"); return; }
    setBusy(b,true,"Receiving…");
    const rc={ id:uuid(), at:nowIso(), note:$("#note",main).value, lines:got.map(l=>({variant_id:l.variant_id, inventory_item_id:l.inventory_item_id, title:l.title, qty:l.now, cost:l.newCost})) };
    try{
      const tracked=got.filter(l=>(PURCH.cat.byId[l.variant_id]||{}).tracked);
      if(tracked.length){ const r=(await gqlv(ADJUST,{key:rc.id, input:{name:"available", reason:"received", referenceDocumentUri:`app://quickbooks-sync/purchase-order/${po.name}`,
          changes:tracked.map(l=>({delta:l.now, inventoryItemId:l.inventory_item_id, locationId:SETTINGS.location_id, changeFromQuantity:null}))}})).inventoryAdjustQuantities; userErrs(r); }
      localStorage.setItem(pendingKey, JSON.stringify(rc)); pending=rc;
      for(const l of got){ const v=PURCH.cat.byId[l.variant_id]; if(!v) continue;
        const before=Math.max(0,v.onHand); const cost = SETTINGS.purchasing.cost_method==="average" && before>0 && v.cost>0 ? (before*v.cost + l.now*l.newCost)/(before+l.now) : l.newCost;
        if(Math.abs(cost-v.cost)>=0.005){ try{ userErrs((await gqlv(SET_COST,{id:l.inventory_item_id, input:{cost:cost.toFixed(2)}})).inventoryItemUpdate); }catch(err){ flash(main,`Cost for ${l.title} wasn't updated: ${err.message}`,"bad"); } } }
      await finishSave(rc);
      location.hash="#po/"+legacy(po.id); flashNext(`Received ${got.reduce((a,l)=>a+l.now,0)} items. Shopify stock is updated; QuickBooks gets it on the next sync.`,"good");
    }catch(err){ flash(main,(pending?"Stock was received in Shopify, but saving the purchase order failed: ":"Nothing was received: ")+err.message,"bad"); render(); }
  });
  render();
};

const SET_RULES = `mutation PanelRules($metafields: [MetafieldsSetInput!]!) { metafieldsSet(metafields: $metafields) { metafields { id } userErrors { field message } } }`;
function suggestion(v, vel, ord, cover, leadOf){
  const sold60=(vel[legacy(v.id)]||[])[1]||0, sold30=(vel[legacy(v.id)]||[])[0]||0; const r=v.rule||{}; const avail=v.onHand+(ord[v.id]||0);
  const lead=leadOf(r.supplier); const pack=Math.max(1,int(r.pack)||1); let qty=0, why="";
  if(r.min!==undefined && r.min!=="" && r.max!==undefined && r.max!==""){ if(avail<=int(r.min)){ qty=int(r.max)-avail; why=`at or below minimum ${int(r.min)}`; } }
  else if(sold60>0){ const daily=sold60/60; const point=Math.ceil(daily*(lead+7)); if(avail<=point){ qty=Math.ceil(daily*(cover+lead))-avail; why=`about ${Math.ceil(daily*7)} sell per week`; } }
  if(qty>0) qty=Math.ceil(qty/pack)*pack;
  return {qty:Math.max(0,qty), why, sold30, sold60, onOrder:ord[v.id]||0};
}

    if(b.dataset.a==="cancel"){ if(!confirmInline(b,"Click again to cancel")) return; c.status="cancelled"; await save(); render(); return; }

    try{ if(b.dataset.a==="save"){ await save(); flash(main,"Progress saved.","good"); setBusy(b,false); return; }
      const adj=d.lines.filter(l=>l.counted!==null&&l.counted!==""&&int(l.counted)!==int(l.expected)).map(l=>({variant_id:l.variant_id,inventory_item_id:l.inventory_item_id,title:l.title,delta:int(l.counted)-int(l.expected),cost:num(l.cost)}));
      if(adj.length){ userErrs((await gqlv(ADJUST,{key:c.id+"-apply", input:{name:"available", reason:"cycle_count_available", referenceDocumentUri:`app://quickbooks-sync/stock-count/${c.name}`,
        changes:adj.map(a=>({delta:a.delta, inventoryItemId:a.inventory_item_id, locationId:SETTINGS.location_id, changeFromQuantity:null}))}})).inventoryAdjustQuantities); }
      d.adjustments=adj; d.applied_at=nowIso(); c.status="applied"; await save(); PURCH.cat=null; review=false; render(); flash(main,`Applied ${adj.length} correction${adj.length===1?"":"s"}. QuickBooks gets them on the next sync.`,"good");
    }catch(err){ flash(main,"Couldn't finish: "+err.message,"bad"); setBusy(b,false); } });
  render();
};

/* ---------- Barcode labels ---------- */
const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128(text){
  const s=String(text); const codes=[];
  if(/^\d+$/.test(s) && s.length%2===0 && s.length>=4){ codes.push(105); for(let i=0;i<s.length;i+=2) codes.push(int(s.substr(i,2))); }
  else { codes.push(104); for(const ch of s){ const c=ch.charCodeAt(0); if(c<32||c>126) throw new Error("Barcode text can only use plain letters and numbers"); codes.push(c-32); } }
  let sum=codes[0]; for(let i=1;i<codes.length;i++) sum+=codes[i]*i; codes.push(sum%103); codes.push(106);
  return codes.map(c=>C128[c]).join("");
}
function barcodeSvg(text, h=40){
  const widths=code128(text); let x=10, bars=""; for(let i=0;i<widths.length;i++){ const w=int(widths[i]); if(i%2===0) bars+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`; x+=w; }
  return `<svg class="bc" viewBox="0 0 ${x+10} ${h}" preserveAspectRatio="none" role="img" aria-label="Barcode ${esc(text)}">${bars}</svg>`;
}
const genCode = v => "29"+legacy(v.id);
const SET_BARCODE = `mutation PanelBarcode($productId: ID!, $variants: [ProductVariantsBulkInput!]!) { productVariantsBulkUpdate(productId: $productId, variants: $variants) { productVariants { id } userErrors { field message } } }`;
pages.labels = async (main, arg) => {
  await loadCatalog();
  const list = JSON.parse(sessionStorage.getItem("labels")||"[]");
  if(arg && arg.includes("~")){ const [poId,rid]=arg.split("~"); const po=(await loadPOs(true)).find(p=>legacy(p.id)===poId); const rc=po&&(po.data.receipts||[]).find(r=>r.id===rid);
    if(rc){ list.length=0; rc.lines.forEach(l=>list.push({id:l.variant_id, qty:int(l.qty)})); } history.replaceState(null,"","#labels"); }
  const save=()=>sessionStorage.setItem("labels",JSON.stringify(list));
  const render=()=>{ const items=list.map(x=>({...x, v:PURCH.cat.byId[x.id]})).filter(x=>x.v); const missing=items.filter(x=>!x.v.barcode&&!x.v.sku);
    main.innerHTML=`<div class="toprow"><div><h1>Barcode labels</h1><p class="sub">Print price labels with barcodes your POS can scan. Products without a barcode get one, saved to Shopify before printing.</p></div></div>
      <div class="tools"><div id="pick" style="flex:1;max-width:520px"></div>
      <label>Label size <select id="fmt"><option value="roll">Roll label 2.25 × 1.25 in (Dymo/Zebra)</option><option value="sheet">Avery 5160 sheet, 30 per page</option></select></label>
      <label class="check"><input type="checkbox" id="price" checked> Show price</label></div>
      <div class="tablewrap"><table class="edit"><thead><tr><th>Product</th><th>Barcode</th><th class="r">Price</th><th class="r">Labels</th><th></th></tr></thead><tbody>
      ${items.map((x,i)=>`<tr data-i="${i}"><td>${esc(x.v.title)}</td><td>${esc(x.v.barcode||x.v.sku||"new: "+genCode(x.v))}</td><td class="r">${money(x.v.price)}</td>
        <td class="r"><input class="n" type="number" min="0" value="${x.qty}" data-k="qty" aria-label="Number of labels"></td><td><button class="link" data-a="del">Remove</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">Add products above, or print labels for a delivery from its purchase order.</td></tr>'}
      </tbody></table></div>
      <div class="actions" style="margin-top:14px"><button class="btn primary" data-a="print" ${items.length?"":"disabled"}>${missing.length?`Save ${missing.length} new barcode${missing.length===1?"":"s"} and print`:"Print labels"}</button> <button class="btn" data-a="clear">Clear list</button></div>`;
    $("#pick",main).appendChild(productPicker(v=>{ const ex=list.find(x=>x.id===v.id); if(ex) ex.qty++; else list.push({id:v.id,qty:Math.max(1,v.onHand>0&&v.onHand<20?v.onHand:1)}); save(); render(); }));
  };
  main.addEventListener("change", e=>{ if(e.target.dataset.k==="qty"){ list[int(e.target.closest("tr").dataset.i)].qty=Math.max(0,int(e.target.value)); save(); } });
  main.addEventListener("click", async e=>{ const b=e.target.closest("[data-a]"); if(!b) return;
    if(b.dataset.a==="del"){ list.splice(int(b.closest("tr").dataset.i),1); save(); render(); return; }
    if(b.dataset.a==="clear"){ list.length=0; save(); render(); return; }
    const items=list.map(x=>({...x, v:PURCH.cat.byId[x.id]})).filter(x=>x.v&&x.qty>0); const missing=items.filter(x=>!x.v.barcode&&!x.v.sku);
    setBusy(b,true,"Saving barcodes…");
    for(const x of missing){ try{ userErrs((await gqlv(SET_BARCODE,{productId:x.v.productId, variants:[{id:x.v.id, barcodes:[{value:genCode(x.v)}]}]})).productVariantsBulkUpdate); x.v.barcode=genCode(x.v); PURCH.cat.byCode[x.v.barcode]=x.v; }
      catch(err){ flash(main,`Couldn't save a barcode for ${x.v.title} (${err.message}). Its label will still print, but the POS won't recognise it until it has a barcode.`,"bad"); } }
    setBusy(b,false); const fmt=$("#fmt",main).value, showPrice=$("#price",main).checked; let html="";
    items.forEach(x=>{ const code=x.v.barcode||x.v.sku||genCode(x.v); for(let i=0;i<x.qty;i++) html+=`<div class="label"><div class="lt">${esc(x.v.title)}</div>${showPrice?`<div class="lp">${money(x.v.price)}</div>`:""}${barcodeSvg(code)}<div class="lc">${esc(code)}</div></div>`; });
    printArea(`<div class="labels ${fmt}">${html}</div>`); render(); });
  render();
};

/* ---------- Stock value ---------- */
pages.value = async (main) => {
  const [cat, vel, pos] = await Promise.all([loadCatalog(true), loadVelocity(), loadPOs()]);
  const st=cat.list.filter(v=>v.tracked); const inStock=st.filter(v=>v.onHand>0);
  const val=inStock.reduce((a,v)=>a+v.onHand*v.cost,0), retail=inStock.reduce((a,v)=>a+v.onHand*v.price,0);
  const group=(f)=>{ const m={}; inStock.forEach(v=>{ const k=f(v)||"(none)"; const g=m[k]||(m[k]={name:k,units:0,value:0,retail:0,count:0}); g.units+=v.onHand; g.value+=v.onHand*v.cost; g.retail+=v.onHand*v.price; g.count++; }); return Object.values(m).sort((a,b)=>b.value-a.value); };
  const sold=v=>(vel[legacy(v.id)]||[])[1]||0;
  const recent=[]; (pos||[]).forEach(p=>(p.data.receipts||[]).forEach(r=>(r.lines||[]).forEach(l=>{ const v=cat.byId[l.variant_id]; recent.push({po:p.name, supplier:p.supplier, at:r.at, title:l.title, qty:int(l.qty), cost:num(l.cost), now:v?v.cost:null}); })));
  main.innerHTML=`<h1>Stock value</h1><p class="sub">What's on your shelves, valued at Shopify's cost per item.</p>
    <div class="ledger"><div class="fig lead"><div class="v">${money(val)}</div><div class="l">Stock value at cost</div></div>
      <div class="fig"><div class="v">${money(retail)}</div><div class="l">At retail price</div></div>
      <div class="fig"><div class="v">${n0(inStock.reduce((a,v)=>a+v.onHand,0))}</div><div class="l">Units on hand</div></div>
      <div class="fig"><div class="v">${n0(inStock.length)}</div><div class="l">Products in stock</div></div></div>
    <div class="subtabs" role="tablist">${[["type","By product type"],["sup","By supplier"],["nocost","No cost set"],["neg","Below zero"],["slow","Not selling"],["costs","Cost history"]].map(([k,l],i)=>`<button role="tab" type="button" data-t="${k}" class="${i===0?"on":""}" aria-selected="${i===0}">${l}</button>`).join("")}</div><div id="tb"></div>`;
  const grpCols=[{k:"name",l:"Group"},{k:"count",l:"Products",r:1},{k:"units",l:"Units",r:1},{k:"value",l:"Value at cost",r:1,f:x=>money(x.value)},{k:"retail",l:"At retail",r:1,f:x=>money(x.retail)},{k:"m",l:"Margin",r:1,v:x=>x.retail?Math.round((1-x.value/x.retail)*100)+"%":"",sv:x=>x.retail?1-x.value/x.retail:0}];
  const prodCols=[{k:"title",l:"Product",w:1},{k:"type",l:"Type"},{k:"onHand",l:"On hand",r:1},{k:"cost",l:"Cost",r:1,f:x=>money(x.cost)},{k:"price",l:"Price",r:1,f:x=>money(x.price)},{k:"value",l:"Value",r:1,v:x=>money(Math.max(0,x.onHand)*x.cost),sv:x=>x.onHand*x.cost},{k:"sold",l:"Sold 60d",r:1,v:sold}];
  const show=k=>{ main.querySelectorAll(".subtabs button").forEach(b=>{ const on=b.dataset.t===k; b.classList.toggle("on",on); b.setAttribute("aria-selected",on); }); const h=$("#tb",main);
    if(k==="type") return makeTable(h,{rows:group(v=>v.type),columns:grpCols,csvName:"stock_by_type",sort:["value",-1],search:false});
    if(k==="sup") return makeTable(h,{rows:group(v=>(v.rule||{}).supplier),columns:grpCols,csvName:"stock_by_supplier",sort:["value",-1],search:false});
    if(k==="nocost") return makeTable(h,{rows:inStock.filter(v=>!v.cost).map(v=>({...v,__id:v.id})),columns:prodCols,csvName:"no_cost",emptyText:"Every product in stock has a cost."});
    if(k==="neg") return makeTable(h,{rows:st.filter(v=>v.onHand<0).map(v=>({...v,__id:v.id})),columns:prodCols,csvName:"below_zero",emptyText:"Nothing is below zero."});
    if(k==="slow") return makeTable(h,{rows:inStock.filter(v=>!sold(v)).map(v=>({...v,__id:v.id})),columns:prodCols,csvName:"not_selling",sort:["value",-1],emptyText:"Everything in stock sold in the last 60 days."});
    makeTable(h,{rows:recent.map((r,i)=>({...r,__id:i})),csvName:"cost_history",sort:["at",-1],emptyText:"No deliveries received through the panel yet.",
      columns:[{k:"at",l:"Received",nw:1,v:x=>shortDate(String(x.at).slice(0,10)),sv:x=>x.at},{k:"po",l:"PO"},{k:"supplier",l:"Supplier"},{k:"title",l:"Product",w:1},{k:"qty",l:"Qty",r:1},{k:"cost",l:"Paid each",r:1,f:x=>money(x.cost)},{k:"now",l:"Cost now",r:1,f:x=>x.now===null?"":money(x.now)}]}); };
  main.querySelector(".subtabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) show(b.dataset.t); });

/* purchasing pages exist only in Shopify admin, and only while the switch is on */
const PURCH_PAGES=["suppliers","pos","po","receive","reorder","counts","count","labels","value"];
PURCH_PAGES.forEach(k=>{ const fn=pages[k]; pages[k]=async(main,arg)=>{ if(!purchOn()){ main.innerHTML=`<h1>Purchasing is switched off</h1><p class="sub">${ADMIN?"Purchase orders, receiving, reorder suggestions, stock counts, labels and stock value are turned on in config.ini on the QuickBooks PC: in the [purchasing] section set enabled = yes, then run a sync. Keep it off while GoStock is still entering purchases in QuickBooks, or purchases will be entered twice.":"Purchasing works in the Shopify admin panel only."}</p>`; return; } return fn(main,arg); }; });
let FLASH_NEXT=null;
function flashNext(msg,kind){ FLASH_NEXT=[msg,kind]; }

/* ---------- Sync now ----------
   PC: asks the sync program (POST /api/sync-now). Shopify admin: writes the app-data metafield
   qbsync.sync_request, which the PC checks every minute. Either way the "Shopify Sync - On Demand"
   Web Connector entry (auto-run every minute) picks it up. The waiting count uses the same rules as
   triggers.queue_items in the sync program. */
const SYNC = { timer:null, busyUntil:0, installId:null };
const QUEUE_Q = `query Queue($cursor: String, $q: String!) { orders(first: 100, after: $cursor, query: $q) {
  pageInfo { hasNextPage endCursor } nodes { id name processedAt displayFinancialStatus cancelledAt test
  totalPriceSet { shopMoney { amount } } totalRefundedSet { shopMoney { amount } } } } }`;
const Q_PAID = ["PAID","PARTIALLY_REFUNDED","REFUNDED"], Q_UNPAID = ["PENDING","PARTIALLY_PAID","AUTHORIZED"];
function queueItems(orders, sales, unpaidOrders){
  const out=[]; const m=b=>parseFloat(((b||{}).shopMoney||{}).amount||0)||0;
  for(const o of orders){ if(o.test) continue; const st=o.displayFinancialStatus||"", r=sales[o.id]; let what="";
    if(!r){ if(Q_PAID.includes(st)) what="new sale"; else if(Q_UNPAID.includes(st) && unpaidOrders==="invoice" && !o.cancelledAt) what="new invoice"; }
    else if(r.kind==="invoice" && Q_PAID.includes(st) && (r.paid||0) < (r.total||0)-0.005) what="invoice payment";
    else if(m(o.totalRefundedSet) > (r.refunded||0)+0.005) what="refund";
    if(what) out.push({order_id:o.id, order:o.name, date:(o.processedAt||"").slice(0,10), what, total:m(o.totalPriceSet)}); }
  return out;
}
async function adminQueue(){
  AD.loadedAt=0; const st=await adminStatus(); if(!st) return {unavailable:true};
  const s=st.settings||{}; const cursor=s.orders_cursor||`${s.start_date}T00:00:00Z`;
  const orders=[]; let after=null;
  do { const d=(await gqlv(QUEUE_Q,{cursor:after, q:`updated_at:>='${cursor}' created_at:>='${s.start_date}'`})).orders;
    orders.push(...d.nodes); after=d.pageInfo.hasNextPage?d.pageInfo.endCursor:null; } while(after && orders.length<1000);
  const sales={}; (await adminSales()).forEach(r=>sales[r.order_id]={kind:r.kind,total:r.total,paid:r.paid,refunded:r.refunded});
  const items=queueItems(orders, sales, s.unpaid_orders);
  const req=await adminRequest();
  return {queue:{count:items.length, items}, mode:s.mode, schedule_minutes:s.schedule_minutes,
          // Done once the PC has handled this click (its id comes back in the published status) or has
          // published anything since; either one ends the wait, so a clock difference can't leave it stuck.
          pending: req && String(req.id)!==String(s.sync_request_handled||"") && req.at > (st.published||0) ? req : null,
          running:false, listener_ok:true};
}
async function adminRequest(){
  const d=await gqlv(`{ currentAppInstallation { id metafield(namespace: "qbsync", key: "sync_request") { value } } }`);
  SYNC.installId=d.currentAppInstallation.id; const v=d.currentAppInstallation.metafield;
  try{ return v?JSON.parse(v.value):null; }catch(e){ return null; }
}
async function requestSync(){
  if(!ADMIN){ const r=await fetch("/api/sync-now",{method:"POST",headers:{"X-QBSync":"1"}}); if(!r.ok) throw new Error("the sync program refused ("+r.status+")"); return; }
  if(!SYNC.installId) await adminRequest();
  const value=JSON.stringify({id:uuid(), at:Date.now()/1000, by:"Shopify admin"});
  const r=(await gqlv(`mutation SyncNow($m: [MetafieldsSetInput!]!) { metafieldsSet(metafields: $m) { metafields { id } userErrors { field message } } }`,
    {m:[{ownerId:SYNC.installId, namespace:"qbsync", key:"sync_request", type:"json", value}]})).metafieldsSet; userErrs(r);
}
async function drawSyncBox(){
  const box=$("#syncbox"); if(!box||OUTSIDE_ADMIN) return;
  clearTimeout(SYNC.timer);
  let q; try{ q = ADMIN ? await adminQueue() : await (await fetch("/api/queue",{cache:"no-store"})).json(); }
  catch(e){ q={error:e.message}; }
  if(q.unavailable){ box.innerHTML=""; return; }
  const verb = q.mode==="compare"?"Run check now":q.mode==="live"?"Sync now":"Run preview now";
  const n = q.queue && !q.queue.error ? q.queue.count : null;
  const list = n ? `<details><summary>What's waiting</summary><ul>${q.queue.items.slice(0,50).map(i=>`<li>${esc(i.order)} ${esc(i.what)}${i.total!=null?" "+money(i.total):""}</li>`).join("")}</ul></details>` : "";
  let html;
  if(q.running) html=`<button class="btn" disabled>Syncing…</button><div class="state">QuickBooks is being updated.</div>`;
  else if(q.pending || Date.now()<SYNC.busyUntil){ const age = q.pending ? Date.now()/1000-q.pending.at : 0;
    html = age>180 ? `<button class="btn" disabled>Requested</button><div class="state warn">Still waiting after ${Math.round(age/60)} minutes. ${ADMIN
        ? "Is the QuickBooks PC on, with QuickBooks, the Web Connector and the sync program running?"
        : `The Web Connector's "Shopify Sync - On Demand" entry starts it; check that its Auto-Run box is ticked, or click Update Selected in the Web Connector.`}</div>`
      : `<button class="btn" disabled>Requested</button><div class="state">Starts within a minute${ADMIN?" on the QuickBooks PC":""}. ${ADMIN?"This page updates when it's done.":""}</div>`; }
  else if(n===0) html=`<div class="state" style="margin:0"><strong style="color:var(--good)">Up to date</strong> · nothing waiting · <button class="link" data-sync>${esc(verb.replace(" now"," anyway"))}</button></div>`;
  else html=`<button class="btn primary" data-sync>${esc(verb)}${n?` · ${n} waiting`:""}</button>${list}`;
  if(q.error||(q.queue&&q.queue.error)) html+=`<div class="state warn">${esc(q.error||q.queue.error)}</div>`;
  if(!ADMIN && q.listener_ok===false) html+=`<div class="state warn">The Web Connector's "Shopify Sync - On Demand" entry isn't checking in, so this button can't start a sync. Tick its Auto-Run box (SETUP-GUIDE.txt, "Sync now").</div>`;
  box.innerHTML=html;
  const busy=!!(q.pending||q.running);
  if(SYNC.wasBusy && !busy){ SYNC.busyUntil=0; refreshChrome(); route(); }   // a sync just finished: show the new data
  SYNC.wasBusy=busy;
  SYNC.timer=setTimeout(drawSyncBox, (busy||Date.now()<SYNC.busyUntil)?5000:20000);
}
document.addEventListener("click", async e=>{ const b=e.target.closest("[data-sync]"); if(!b) return;
  b.disabled=true; try{ await requestSync(); SYNC.busyUntil=Date.now()+90000; }
  catch(err){ alertBox("Couldn't ask for a sync: "+err.message); } drawSyncBox(); });
function alertBox(msg){ const m=$("#main"); if(m) flash(m,msg,"bad"); }
async function route(){
  if(OUTSIDE_ADMIN) return outsideAdminNotice($("#main"));
  clearTimeout(timer);
  const [page, arg] = (location.hash.slice(1)||"overview").split("/");
  const fn = pages[page] || pages.overview;
  const navKey={po:"pos",receive:"pos",suppliers:"pos",count:"counts"}[page]||(pages[page]?page:"overview");
  document.querySelectorAll("nav a").forEach(a=>{ const on=a.dataset.page===navKey; a.classList.toggle("on",on); if(on) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const old=$("#main"); const main=old.cloneNode(false); old.replaceWith(main);
  try{ await fn(main, arg); if(FLASH_NEXT){ flash(main,...FLASH_NEXT); FLASH_NEXT=null; } }
  catch(e){ main.innerHTML = ADMIN
      ? `<h1>Can't load this page</h1><p class="sub">Shopify didn't return the sync data. Reload the page; if it keeps happening, check that the app was deployed with Direct API access turned on (see SHOPIFY-PANEL-SETUP.txt).</p><p class="muted">${esc(e.message)}</p>`
      : `<h1>Can't load this page</h1><p class="sub">The sync program isn't answering. Make sure it's running (2-Start-Sync-Window.bat), then reload this page.</p><p class="muted">${esc(e.message)}</p>`; }
  refreshChrome();
  if(page==="overview"||!pages[page]) timer=setTimeout(route, ADMIN ? 120000 : 30000);
}
async function refreshChrome(){
  try{
    const o = await api("/api/overview");
    SETTINGS = o.settings||{};
    document.querySelectorAll("nav a.purch").forEach(a=>a.hidden=!purchOn());
    const set=(id,n)=>{ const el=$(id); el.hidden=!n; el.textContent=n||""; };
    set("#n-prob", o.problem_count); set("#n-rec", o.recon_problems); set("#n-inv", o.kpis ? o.kpis.open_invoices : 0);
    if(ADMIN){ $("#foot").textContent = o.published ? `Updated ${ago(o.published)} from the QuickBooks PC` : ""; return; }
    const panel = o.settings && o.settings.panel_url ? `<br>Shopify admin panel: ${o.settings.panel_error?'<span style="color:var(--bad)">not updating</span>':o.settings.panel_published?"updated "+esc(ago(o.settings.panel_published)):"waiting for first sync"}` : "";
    $("#foot").innerHTML = o.settings && !o.settings.error ? `${{live:"Live",compare:"Compare (read-only)"}[o.settings.mode]||"Preview"} mode<br>Syncing orders since ${esc(niceDate(o.settings.start_date))}<br>Stock to Shopify: ${o.settings.push_inventory?"on":"off"}${panel}<br><a href="${esc(o.settings.admin_url)}" target="_blank" rel="noopener">Open Shopify admin</a>` : "Settings need attention";
  }catch(e){ $("#foot").textContent = ADMIN ? "Can't read the sync data from Shopify" : "Sync program not reachable"; }
}
document.body.classList.toggle("embedded", ADMIN);
window.addEventListener("hashchange", ()=>{ route(); $("#main").focus({preventScroll:true}); });
if(OUTSIDE_ADMIN) route(); else { refreshChrome().then(route); drawSyncBox(); }
</script>
